<script id="engine">
function Engine(){
 const units=[];for(let r=0;r<9;r++)units.push(Array.from({length:9},(_,c)=>r*9+c));for(let c=0;c<9;c++)units.push(Array.from({length:9},(_,r)=>r*9+c));for(let b=0;b<9;b++)units.push(Array.from({length:9},(_,k)=>(Math.floor(b/3)*3+Math.floor(k/3))*9+b%3*3+k%3));
 const peers=Array.from({length:81},(_,i)=>[...new Set(units.filter(u=>u.includes(i)).flat())].filter(j=>j!==i));
 const bits=m=>{let a=[];for(let n=1;n<=9;n++)if(m&(1<<n))a.push(n);return a};
 function candidates(a,i){let m=1022;for(const j of peers[i])m&=~(1<<a[j]);return m}
 function valid(a){return a.length===81&&a.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=9&&(!v||!peers[i].some(j=>a[j]===v)))}
 // MRV 回溯：每次选择候选数最少的空格。找到两个解立即停止，用于唯一解检验。
 function solve(input,limit=2,rng=null){let a=input.slice(),count=0,solution=null;if(!valid(a))return {count,solution};function dfs(){let p=-1,opts;for(let i=0;i<81;i++)if(!a[i]){let ns=bits(candidates(a,i));if(!ns.length)return;if(p<0||ns.length<opts.length){p=i;opts=ns;if(ns.length===1)break}}if(p<0){count++;if(!solution)solution=a.slice();return}if(rng)shuffle(opts,rng);for(const n of opts){a[p]=n;dfs();if(count>=limit)break}a[p]=0}dfs();return {count,solution}}
 function shuffle(a,rng){for(let i=a.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 function seeded(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
 // 逻辑分级：裸单 → 隐单 → 宫行列锁定/裸对；仍无法完成则归为专家。
 function rate(input){let a=input.slice(),m=a.map((v,i)=>v?0:candidates(a,i)),level=0;function put(i,n){a[i]=n;m[i]=0;for(const j of peers[i])m[j]&=~(1<<n)}for(let step=0;step<1000;step++){if(a.every(Boolean))return level;let p=m.findIndex((v,i)=>!a[i]&&bits(v).length===1);if(p>=0){put(p,bits(m[p])[0]);continue}let found=false;for(const u of units){for(let n=1;n<=9;n++){let places=u.filter(i=>!a[i]&&(m[i]&(1<<n)));if(places.length===1){put(places[0],n);level=Math.max(level,1);found=true;break}}if(found)break}if(found)continue;let changed=false;const remove=(i,mask)=>{if(!a[i]&&(m[i]&mask)){m[i]&=~mask;changed=true}};for(const u of units){for(let n=1;n<=9;n++){let places=u.filter(i=>!a[i]&&(m[i]&(1<<n)));if(places.length>=2)for(const v of units)if(v!==u&&places.every(i=>v.includes(i)))for(const i of v)if(!u.includes(i))remove(i,1<<n)}for(const i of u)if(!a[i]&&bits(m[i]).length===2){let pair=u.filter(j=>!a[j]&&m[j]===m[i]);if(pair.length===2)for(const j of u)if(!pair.includes(j))remove(j,m[i])}}if(changed){level=2;continue}return 3}return 3}
 // 随机回溯生成终盘；逐格挖空，每一步必须保持恰好一个解。题面还需通过逻辑级别筛选。
 function generate(level,rng=Math.random){const targets=[42,35,30,26];for(let attempt=0;attempt<600;attempt++){let solution=solve(Array(81).fill(0),1,rng).solution, puzzle=solution.slice();let target=targets[level]+Math.floor(rng()*3)-1;for(const i of shuffle(Array.from({length:81},(_,i)=>i),rng)){if(puzzle.filter(Boolean).length<=target)break;let v=puzzle[i];puzzle[i]=0;if(solve(puzzle,2).count!==1)puzzle[i]=v}if(rate(puzzle)===level)return {puzzle,solution,level}}throw Error('本次未找到符合逻辑等级的题目，请重试。')}
 return {units,peers,bits,candidates,valid,solve,rate,generate,seeded};
}

const E=Engine(),$=id=>document.getElementById(id),names=['简单','中等','困难','专家'];

function save(){if(!game||editing||busy)return;try{localStorage.setItem('quiet-sudoku-v1',JSON.stringify({game,selected,noteMode,history:history.slice(-200),completed}))}catch{}}

function wrong(i){let n=game.values[i];return n&&(E.peers[i].some(j=>game.values[j]===n)||(!editing&&game.unique&&n!==game.solution[i]))}

function render(){if(!game)return;const v=game.values[selected];const concealed=paused||busy;cells.forEach((b,i)=>{b.className='cell'+(game.givens[i]&&!editing?' given':'')+(i===selected?' selected':'')+(E.peers[selected].includes(i)?' related':'')+(v&&game.values[i]===v?' same':'')+(!concealed&&wrong(i)?' error':'');b.tabIndex=i===selected?0:-1;b.setAttribute('aria-label',`第${Math.floor(i/9)+1}行第${i%9+1}列，${concealed?'已隐藏':game.values[i]||'空格'}${!concealed&&game.givens[i]&&!editing?'，给定数字':''}`);b.setAttribute('aria-pressed',String(i===selected));b.replaceChildren();if(concealed)return;if(game.values[i])b.textContent=game.values[i];else if(game.notes[i]){let p=document.createElement('span');p.className='pencil';for(let n=1;n<=9;n++){let s=document.createElement('span');s.textContent=game.notes[i]&(1<<n)?n:'';p.append(s)}b.append(p)}});
 $('label').textContent=editing?'自定义 · 编辑题面':game.label;$('errors').textContent=editing?'实时冲突检测':`错误 ${game.errors}`;$('clock').textContent=timeText(game.elapsed);$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'继续':'暂停');$('pause').disabled=editing||busy||game.won;

function start(p,sol,level,label,id=null,unique=true){carry=0;last=performance.now();game={givens:p.slice(),values:p.slice(),notes:Array(81).fill(0),solution:sol.slice(),level,label,id,unique,errors:0,hints:3,elapsed:0,won:false,nextWarning:3};selected=p.findIndex(v=>!v);if(selected<0)selected=0;history=[];paused=false;editing=false;noteMode=false;busy=false;backup=null;render()}

function erase(){if(!canEdit()||(!game.values[selected]&&!game.notes[selected]))return;snapshot();game.values[selected]=0;game.notes[selected]=0;render()}
function undo(){if(paused||busy||game.won||!history.length)return;let h=history.pop();game.values=h.values;game.notes=h.notes;render()}
function toggleNotes(){if(editing||paused||busy||game.won)return;noteMode=!noteMode;render()}
function hint(){if(editing||paused||busy||game.won||!game.hints)return;let i=selected;if(!game.unique){if(game.values[i])i=game.values.findIndex(v=>!v)}else if(game.givens[i]||game.values[i]===game.solution[i])i=game.values.findIndex((v,j)=>!game.givens[j]&&v!==game.solution[j]);if(i<0)return;
 // 自定义多解题：提示采用兼容当前填写的合法完成方案，避免把另一合法解误判为错。

 snapshot();selected=i;game.values[i]=solution[i];game.notes[i]=0;clearPeerNotes(i,solution[i]);game.hints--;render();checkWin()}
function checkWin(){if(editing||busy||game.won||!game.values.every(Boolean)||!E.valid(game.values))return;game.won=true;paused=false;if(game.id)completed[game.id]=true;render();for(let i=0;i<45;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#3268c8','#9ab9ef','#d9b26b','#7cbda8'][i%4];c.style.animationDelay=Math.random()*.5+'s';document.body.append(c);setTimeout(()=>c.remove(),3500)}dialog('漂亮，完成了！',`${game.label}\n用时 ${timeText(game.elapsed)} · 错误 ${game.errors} 次\n使用提示 ${3-game.hints} 次`,[['欣赏棋盘'],['再来一局',()=>newGame(false),true]])}
function restartNow(){let g=game;start(g.givens,g.solution,g.level,g.label,g.id,g.unique)}
function leaveGuard(fn){if(editing||game&&!game.won&&(game.elapsed>0||history.length))confirmAction('开始另一段思考？','当前对局或编辑内容将被替换，确定继续吗？',fn);else fn()}
function generateAsync(level){return new Promise((resolve,reject)=>{const code=Engine.toString()+';onmessage=e=>{try{postMessage({result:Engine().generate(e.data)})}catch(err){postMessage({error:err.message})}}';let url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));try{worker=new Worker(url)}catch(e){URL.revokeObjectURL(url);reject(Error('此浏览器不支持本地生成，请使用题库或更换现代浏览器。'));return}URL.revokeObjectURL(url);worker.onmessage=e=>{worker.terminate();worker=null;e.data.error?reject(Error(e.data.error)):resolve(e.data.result)};worker.onerror=()=>{worker.terminate();worker=null;reject(Error('生成失败，请重试或打开题库。'))};worker.postMessage(level)})}
async function newGame(guard=true){if(guard){leaveGuard(()=>newGame(false));return}let level=+$('difficulty').value;busy=true;render();try{let p=await generateAsync(level);start(p.puzzle,p.solution,level,names[level]+' · 随机题')}catch(e){busy=false;render();notify(e.message)}}
function custom(){leaveGuard(()=>{backup={game:clone(game),history:clone(history),paused,noteMode,selected};editing=true;paused=false;noteMode=false;history=[];selected=0;game={...game,givens:Array(81).fill(0),values:Array(81).fill(0),notes:Array(81).fill(0),won:false,elapsed:0};render()})}
function finishCustom(){const p=game.values.slice(),r=E.solve(p,2);if(!r.count){dialog('当前数独无解，请检查输入','请检查红色冲突格，以及其他已填写的数字。',[['返回修改',null,true]]);return}if(p.every(Boolean)){notify('题面已填满，请至少留出一个空格。');return}const run=()=>start(p,r.solution,-1,'自定义题目',null,r.count===1);if(r.count>1)dialog('题目存在多个合法解','可以继续编辑以增加约束，也可以开始游戏。多解模式只标记直接冲突，任何合法终盘均可获胜；提示将兼容你当前的填写。',[['继续编辑'],['开始游戏',run,true]]);else run()}
function showLibrary(level=0){let content=document.createElement('div'),tabs=document.createElement('div');tabs.className='library-tabs';['初级 · 50 道','中级 · 50 道'].forEach((s,l)=>{let b=document.createElement('button');b.textContent=s;b.className=l===level?'active':'';b.onclick=()=>showLibrary(l);tabs.append(b)});content.append(tabs);let grid=document.createElement('div');grid.className='library-grid';BANK[level].forEach((p,i)=>{let id=(level?'M':'E')+String(i+1).padStart(3,'0'),b=document.createElement('button');b.textContent=id+(completed[id]?' ✓':'');b.title=completed[id]?'已完成':'开始此题';b.className=(completed[id]?'done ':'')+(game.id===id?'current':'');b.onclick=()=>{$('modal').close();leaveGuard(()=>{let a=p.split('').map(Number);$('difficulty').value=level;start(a,E.solve(a,1).solution,level,(level?'中级':'初级')+' · '+id,id)})};grid.append(b)});content.append(grid);dialog('固定题库','相同编号，相同题面。与朋友一起挑战。✓ 为本设备完成记录。',[['关闭']],content)}
$('new').onclick=()=>newGame();$('restart').onclick=()=>confirmAction('重新挑战本道题？','保留题面，清空填写和笔记；计时、错误次数与提示次数将重置。',restartNow);$('custom').onclick=custom;$('startCustom').onclick=finishCustom;$('cancelCustom').onclick=()=>{if(backup){({game,history,paused,noteMode,selected}=backup);backup=null;editing=false;render()}};$('library').onclick=()=>showLibrary();$('undo').onclick=undo;$('erase').onclick=erase;$('notes').onclick=toggleNotes;$('hint').onclick=hint;

$('help').onclick=()=>dialog('给思考一点线索','每行、每列和每个 3×3 宫内，1–9 各出现一次。\n\n方向键 / WASD：移动选择\n1–9：填数 · N：笔记\nDelete / Backspace：擦除\nCtrl / ⌘ + Z：撤销\n\n蓝色为玩家填写，红色为错误。笔记会随同行、同列、同宫的填数自动清理。撤销不退回累计错误或已用提示。\n\n简单：裸单；中等：需要隐单；困难：需要锁定候选或裸对；专家：上述逻辑不足，需要更深入推理。此分级为本应用标准。\n\n自动保存当前对局（浏览器允许本地存储时）。切到后台会自动暂停。',[['知道了',null,true]]);

document.addEventListener('keydown',e=>{if($('modal').open||['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||e.altKey)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}if(e.ctrlKey||e.metaKey||paused||busy)return;let k=e.key.toLowerCase(),r=Math.floor(selected/9),c=selected%9;if(['arrowup','w','arrowdown','s','arrowleft','a','arrowright','d'].includes(k)){e.preventDefault();if(k==='arrowup'||k==='w')r=(r+8)%9;if(k==='arrowdown'||k==='s')r=(r+1)%9;if(k==='arrowleft'||k==='a')c=(c+8)%9;if(k==='arrowright'||k==='d')c=(c+1)%9;selected=r*9+c;render();cells[selected].focus({preventScroll:true})}else if(/^[1-9]$/.test(k)){e.preventDefault();input(+k)}else if(k==='backspace'||k==='delete'){e.preventDefault();erase()}else if(k==='n'){e.preventDefault();toggleNotes()}});
